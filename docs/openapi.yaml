components:
  schemas:
    AlertCreate:
      properties:
        device_id:
          type: string
          format: uuid
          title: Device Id
        alert_type:
          $ref: '#/components/schemas/AlertType'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
      type: object
      required:
      - device_id
      - alert_type
      - severity
      title: AlertCreate
    AlertResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        device_id:
          type: string
          format: uuid
          title: Device Id
        alert_type:
          $ref: '#/components/schemas/AlertType'
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        created_at:
          type: string
          format: date-time
          title: Created At
        acknowledged_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Acknowledged At
        resolved_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Resolved At
        is_active:
          type: boolean
          title: Is Active
          default: true
        links:
          items:
            $ref: '#/components/schemas/HateoasLink'
          type: array
          title: Links
      type: object
      required:
      - id
      - device_id
      - alert_type
      - severity
      - created_at
      title: AlertResponse
    AlertSeverity:
      type: string
      enum:
      - info
      - warning
      - critical
      title: AlertSeverity
    AlertType:
      type: string
      enum:
      - HIGH_TEMPERATURE
      - LOW_HUMIDITY
      - ANOMALY_DETECTED
      - DEVICE_OFFLINE
      - WINDOW_OPEN
      - CONSUMPTION_LIMIT
      title: AlertType
    DeviceControlRequest:
      properties:
        action:
          type: string
          pattern: ^(on|off|setpoint)$
          title: Action
          description: 'Ação: ''on'', ''off'' ou ''setpoint'''
        value:
          anyOf:
          - type: number
            maximum: 30.0
            minimum: 16.0
          - type: 'null'
          title: Value
          description: Temperatura desejada (obrigatório para setpoint)
      type: object
      required:
      - action
      title: DeviceControlRequest
    DeviceControlResponse:
      properties:
        status:
          type: string
          title: Status
        device_id:
          type: string
          format: uuid
          title: Device Id
        action:
          type: string
          title: Action
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
        timestamp:
          type: string
          format: date-time
          title: Timestamp
      type: object
      required:
      - status
      - device_id
      - action
      - timestamp
      title: DeviceControlResponse
    DeviceCreate:
      properties:
        room_id:
          type: string
          format: uuid
          title: Room Id
        device_type:
          $ref: '#/components/schemas/DeviceType'
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        serial_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Serial Number
        setpoint_celsius:
          anyOf:
          - type: number
            maximum: 30.0
            minimum: 16.0
          - type: 'null'
          title: Setpoint Celsius
        mqtt_topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Mqtt Topic
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
      type: object
      required:
      - room_id
      - device_type
      title: DeviceCreate
    DeviceResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        room_id:
          type: string
          format: uuid
          title: Room Id
        device_type:
          $ref: '#/components/schemas/DeviceType'
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        serial_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Serial Number
        status:
          $ref: '#/components/schemas/DeviceStatus'
        is_active:
          type: boolean
          title: Is Active
        power_on:
          type: boolean
          title: Power On
        setpoint_celsius:
          anyOf:
          - type: number
          - type: 'null'
          title: Setpoint Celsius
        mqtt_topic:
          anyOf:
          - type: string
          - type: 'null'
          title: Mqtt Topic
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        last_seen_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen At
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
