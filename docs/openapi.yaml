openapi: 3.1.0
info:
  title: Smart Building API
  description: Sistema de controle inteligente de ar-condicionado
  version: 1.0.0
  contact:
    name: Smart Building ExpoTech
    email: suporte@smartbuilding.local
paths:
  /api/v1/health:
    get:
      tags:
      - Health
      summary: Health check
      description: 'Monitoramento de subsistemas.


        Se o PostgreSQL estiver indisponível, retorna **503** em RFC 7807.

        MQTT/simulador offline degradam o status, mas não derrubam a API (falha parcial).'
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Erro de validação — parâmetros ou corpo semanticamente inválidos.
          content:
            application/problem+json:
              schema: &id001
                $ref: '#/components/schemas/ProblemDetail'
              example: &id002
                type: https://smartbuilding.local/errors/validation-error
                title: Erro de validação
                status: 422
                detail: 'page: ensure this value is greater than or equal to 1'
                instance: /api/v1/exemplo
            application/json:
              schema: *id001
              example: *id002
        '429':
          description: Limite de requisições excedido (rate limiting via Redis/IP).
          content:
            application/problem+json:
              schema: &id003
                $ref: '#/components/schemas/ProblemDetail'
              example: &id004
                type: https://smartbuilding.local/errors/rate-limit-exceeded
                title: Limite de requisições atingido
                status: 429
                detail: Aguarde antes de tentar novamente.
                instance: /api/v1/exemplo
            application/json:
              schema: *id003
              example: *id004
        '503':
          description: Serviço indisponível ou operação bloqueada por degradação controlada.
          content:
            application/problem+json:
              schema: &id005
                $ref: '#/components/schemas/ProblemDetail'
              example: &id006
                type: https://smartbuilding.local/errors/service-unavailable
                title: Serviço indisponível
                status: 503
                detail: Subsistema dependente indisponível ou operação já em andamento.
                instance: /api/v1/exemplo
            application/json:
              schema: *id005
              example: *id006
