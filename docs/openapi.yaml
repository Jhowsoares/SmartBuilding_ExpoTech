openapi: 3.1.0
info:
  title: Smart Building API
  version: 1.0.0
  contact:
    name: Suporte Smart Building
    email: suporte@smartbuilding.io
    url: https://smartbuilding.io/suporte
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
paths:
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Health check
      description: "Retorna o status operacional da API para monitoramento e health check do servidor."
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Health Check Api V1 Health Get
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Autenticar e obter tokens JWT
      description: "Realiza a autenticação do usuário utilizando email e senha, retornando os tokens JWT necessários."
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              admin:
                summary: Login como administrador
                value:
                  email: admin@smartbuilding.io
                  password: Adm1n@Seguro!
              operador:
                summary: Login como operador
                value:
                  email: operador@smartbuilding.io
                  password: Op3r@dor!
        required: true
      responses:
        '200':
          description: Autenticação bem-sucedida — retorna access_token e refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzZmE4NWY2NC01NzE3LTQ1NjItYjNmYy0yYzk2M2Y2NmFmYTYiLCJyb2xlIjoiYWRtaW4iLCJleHAiOjE3MTcwODk2MDB9.exemplo
                refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzZmE4NWY2NC01NzE3LTQ1NjItYjNmYy0yYzk2M2Y2NmFmYTYiLCJ0eXBlIjoicmVmcmVzaCIsImV4cCI6MTcxNzY5NDQwMH0.exemplo
                token_type: bearer
                expires_in: 3600
        '401':
          description: Credenciais inválidas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: 'https://tools.ietf.org/html/rfc7235#section-3.1'
                title: Unauthorized
                status: 401
                detail: Email ou senha incorretos.
                instance: /api/v1/auth/login
        '422':
          description: Dados de entrada inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: 'https://tools.ietf.org/html/rfc7231#section-6.5.1'
                title: Unprocessable Entity
                status: 422
                detail: 'email: valor não é um endereço de e-mail válido'
                instance: /api/v1/auth/login
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Renovar access token
      description: "Gera um novo token de acesso válido utilizando um Refresh Token ativo."
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzZmE4NWY2NC01NzE3LTQ1NjItYjNmYy0yYzk2M2Y2NmFmYTYiLCJ0eXBlIjoicmVmcmVzaCIsImV4cCI6MTcxNzY5NDQwMH0.exemplo
        required: true
      responses:
        '200':
          description: Novo access_token emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Revogar token (logout)
      description: "Invalida o token de sessão atual do usuário ativo no sistema."
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Logout Api V1 Auth Logout Post
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - HTTPBearer: []
  /api/v1/sensors/data:
    post:
      tags:
        - Sensors
      summary: Ingerir leitura de sensor IoT
      description: "Envia dados e métricas em tempo real coletadas por sensores IoT periféricos instalados nas salas."
      operationId: ingest_sensor_data_api_v1_sensors_data_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorDataIngest'
            examples:
              temperature:
                summary: Leitura de temperatura
                value:
                  sensor_id: sensor-temperature-0001
                  tipo: temperature
                  valor: 26.4
                  tick: 1482
                  timestamp: '2026-05-30T14:00:00Z'
              humidity:
                summary: Leitura de umidade
                value:
                  sensor_id: sensor-humidity-0002
                  tipo: humidity
                  valor: 65.0
                  tick: 983
                  timestamp: '2026-05-30T14:00:00Z'
              presence:
                summary: Detecção de presença
                value:
                  sensor_id: sensor-presence-0003
                  tipo: presence
                  valor: 1.0
                  tick: 210
                  timestamp: '2026-05-30T14:00:00Z'
        required: true
      responses:
        '201':
          description: Leitura registrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorDataResponse'
              example:
                id: 84231
                sensor_id: sensor-temperature-0001
                tipo: temperature
                valor: 26.4
                tick: 1482
                timestamp: '2026-05-30T14:00:00Z'
                is_anomaly: false
                received_at: '2026-05-30T14:00:00.123Z'
                links:
                  - rel: self
                    href: /api/v1/sensors/sensor-temperature-0001/latest
                    method: GET
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Payload inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                type: 'https://tools.ietf.org/html/rfc7231#section-6.5.1'
                title: Unprocessable Entity
                status: 422
                detail: 'sensor_id: não corresponde ao padrão sensor-(temperature|humidity|presence)-NNNN'
                instance: /api/v1/sensors/data
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - HTTPBearer: []
  /api/v1/sensors:
    get:
      tags:
        - Sensors
      summary: Listar sensores registrados
      operationId: list_sensors_api_v1_sensors_get
      security:
        - HTTPBearer: []
      responses:
        '200':
          description: Alerta reconhecido com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorListResponse'
              example:
                data:
                  - id: sensor-temperature-0001
                    tipo: temperature
                    status: online
                    last_seen: '2026-05-30T14:00:00Z'
                  - id: sensor-humidity-0002
                    tipo: humidity
                    status: offline
                    last_seen: '2026-05-30T13:45:00Z'
                meta:
                  total: 12
                  page: 1
                  size: 20
                  total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/sensors/{sensor-id}:
    get:
      tags:
        - Sensors
      summary: Detalhes de um sensor
      description: "Recupera informações detalhadas e metadados estruturais de um dispositivo sensor específico."
      operationId: get_sensor_api_v1_sensors__sensor_id__get
      security:
        - HTTPBearer: []
      parameters:
        - name: sensor-id
          in: path
          required: true
          description: "ID único do sensor operacional em formato kebab-case."
          schema:
            type: string
            title: Sensor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/sensors/{sensor-id}/data:
    get:
      tags:
        - Sensors
      summary: Histórico de leituras
      description: "Retorna o histórico cronológico de medições registradas por um determinado sensor."
      operationId: get_sensor_history_api_v1_sensors__sensor_id__data_get
      security:
        - HTTPBearer: []
      parameters:
        - name: sensor-id
          in: path
          required: true
          description: "ID único do sensor para consulta estruturado em kebab-case."
          schema:
            type: string
            title: Sensor Id
        - name: period
          in: query
          required: false
          description: "O intervalo de tempo para o histórico de leituras (Ex: 24h, 7d)."
          schema:
            type: string
            pattern: ^(1h|24h|7d|30d)$
            default: 24h
            title: Period
        - name: page
          in: query
          required: false
          description: "Indexador numérico da página atual dos dados."
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: limit
          in: query
          required: false
          description: "Volume limite máximo de registros por página (Mapeado ao limite do backend: máximo 200)."
          schema:
            type: integer
            maximum: 200
            minimum: 1
            default: 50
            title: Limit
        - name: anomalies_only
          in: query
          required: false
          description: "Se ativado, filtra e exibe unicamente as leituras que dispararam anomalias."
          schema:
            type: boolean
            default: false
            title: Anomalies Only
      responses:
        '200':
          description: Successful Response
          headers:
            Cache-Control:
              schema:
                type: string
                example: "private, no-store"
              description: "Proteção de privacidade para evitar cache de séries temporais do usuário."
            Deprecation:
              schema:
                type: string
                example: "date=2027-01-01"
              description: "Indicação teórica de ciclo de vida da versão."
            Sunset:
              schema:
                type: string
                example: "date=2027-06-01"
              description: "Prazo teórico final para encerramento do recurso legado."
          content:
            application/json:
              schema:
                type: object
                title: Response Get Sensor History Api V1 Sensors Sensor Id Data Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/sensors/{sensor-id}/latest:
    get:
      tags:
        - Sensors
      summary: Última leitura de um sensor
      description: "Recupera o registro mais recente capturado e enviado pelo sensor IoT."
      operationId: get_sensor_latest_api_v1_sensors__sensor_id__latest_get
      security:
        - HTTPBearer: []
      parameters:
        - name: sensor-id
          in: path
          required: true
          description: "Identificador estrutural do sensor em formato kebab-case."
          schema:
            type: string
            title: Sensor Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorLatestResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/devices:
    get:
      tags:
        - Devices
      summary: Listar dispositivos
      description: "Retorna uma listagem paginada contendo todos os dispositivos eletroeletrônicos e controladores integrados."
      operationId: list_devices_api_v1_devices_get
      security:
        - HTTPBearer: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Número identificador da página para consulta estruturada."
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: limit
          in: query
          required: false
          description: "Limite de amostragem por página de dispositivos."
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Limit
        - name: room_id
          in: query
          required: false
          description: "Filtro de localidade por identificador UUID da sala."
          schema:
            anyOf:
              - type: string
                format: uuid
              - type: 'null'
            title: Room Id
        - name: status
          in: query
          required: false
          description: "Filtro situacional do dispositivo (online/offline)."
          schema:
            anyOf:
              - $ref: '#/components/schemas/DeviceStatus'
              - type: 'null'
            title: Status
      responses:
        '200':
          description: Successful Response
          headers:
            Cache-Control:
              schema:
                type: string
                example: "private, no-store"
              description: "Evita o cacheamento inadequado do status e catálogo dos dispositivos."
          content:
            application/json:
              schema:
                type: object
                title: Response List Devices Api V1 Devices Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Devices
      summary: Cadastrar dispositivo
      description: "Registra e vincula uma nova unidade de hardware controlador (ex: Ar-Condicionado) em uma sala activa."
      operationId: create_device_api_v1_devices_post
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreate'
            example:
              name: AC Sala de Reuniões 01
              room_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              model: Carrier XPower 18000 BTU
              serial_number: CXP-2024-00421
      responses:
        '201':
          description: Dispositivo cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
              example:
                id: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
                name: AC Sala de Reuniões 01
                room_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                model: Carrier XPower 18000 BTU
                serial_number: CXP-2024-00421
                status: offline
                setpoint: 24.0
                is_on: false
                created_at: '2026-05-30T10:00:00Z'
                updated_at: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/devices/{device-id}:
    get:
      tags:
        - Devices
      summary: Detalhes de um dispositivo
      description: "Retorna as especificações técnicas completas e o estado de funcionamento de um dispositivo."
      operationId: get_device_api_v1_devices__device_id__get
      security:
        - HTTPBearer: []
      parameters:
        - name: device-id
          in: path
          required: true
          description: "UUID fixado do dispositivo em formato kebab-case."
          schema:
            type: string
            format: uuid
            title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Devices
      summary: Atualizar e Controlar dispositivo (Melhoria REST)
      description: "Atualiza propriedades cadastrais ou comanda o estado de ativação do dispositivo (ex: ligar/desligar/alterar setpoint), aplicando o modelo adequado REST de recursos de controle."
      operationId: update_device_api_v1_devices__device_id__patch
      security:
        - HTTPBearer: []
      parameters:
        - name: device-id
          in: path
          required: true
          description: "ID único do dispositivo em formato kebab-case que receberá a atualização cadastral ou instrução de comando."
          schema:
            type: string
            format: uuid
            title: Device Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdate'
            examples:
              ligar:
                summary: Ligar o dispositivo alterando estado interno
                value:
                  is_on: true
                  setpoint: 22.0
              ajuste_setpoint:
                summary: Alterar unicamente a temperatura alvo
                value:
                  setpoint: 20.5
      responses:
        '200':
          description: Dispositivo modificado ou comando executado com pleno sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Modificação inválida ou parâmetros fora de conformidade estrutural.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Devices
      summary: Desativar dispositivo
      description: "Remove logicamente ou dissocia um equipamento de hardware do fluxo ativo de automação."
      operationId: delete_device_api_v1_devices__device_id__delete
      security:
        - HTTPBearer: []
      parameters:
        - name: device-id
          in: path
          required: true
          description: "ID UUID do equipamento a ser excluído em padrão kebab-case."
          schema:
            type: string
            format: uuid
            title: Device Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/devices/{device-id}/status:
    get:
      tags:
        - Devices
      summary: Status atual do dispositivo
      description: "Consulta rápida voltada a retornar o estado de funcionamento operacional do equipamento."
      operationId: get_device_status_api_v1_devices__device_id__status_get
      security:
        - HTTPBearer: []
      parameters:
        - name: device-id
          in: path
          required: true
          description: "Identificador UUID do hardware configurado em kebab-case."
          schema:
            type: string
            format: uuid
            title: Device Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/rooms:
    get:
      tags:
        - Rooms
      summary: Listar salas
      description: "Retorna a relação de cômodos prediais cadastrados no sistema."
      operationId: list_rooms_api_v1_rooms_get
      security:
        - HTTPBearer: []
      parameters:
        - name: page
          in: query
          required: false
          description: "Página ativa da busca."
          schema:
            type: integer
            minimum: 1
            default: 1
            title: Page
        - name: size
          in: query
          required: false
          description: "Quantidade máxima de salas por resposta."
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 20
            title: Size
        - name: building
          in: query
          required: false
          description: "Filtro nominal do Bloco Predial."
          schema:
            anyOf:
              - type: string
                maxLength: 100
              - type: 'null'
            title: Building
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response List Rooms Api V1 Rooms Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Rooms
      summary: Cadastrar sala
      description: "Inicializa o mapeamento lógico de uma nova sala física na infraestrutura corporativa do Smart Building."
      operationId: create_room_api_v1_rooms_post
      security:
        - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreate'
            example:
              name: Sala de Reuniões 01
              building: Bloco A
              floor: 3
              area_m2: 32.5
      responses:
        '201':
          description: Sala cadastrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
              example:
                id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                name: Sala de Reuniões 01
                building: Bloco A
                floor: 3
                area_m2: 32.5
                created_at: '2026-05-30T09:00:00Z'
                updated_at: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Dados inválidos
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/rooms/{room-id}:
    get:
      tags:
        - Rooms
      summary: Detalhes de uma sala
      description: "Acessa os metadados de área, andar e sensores associados a uma sala."
      operationId: get_room_api_v1_rooms__room_id__get
      security:
        - HTTPBearer: []
      parameters:
        - name: room-id
          in: path
          required: true
          description: "UUID identificador da sala configurado em kebab-case."
          schema:
            type: string
            format: uuid
            title: Room Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
