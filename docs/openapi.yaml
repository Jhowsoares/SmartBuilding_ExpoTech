  /api/v1/sensors/{sensor_id}/data:
    get:
      tags:
      - Sensors
      summary: Histórico de leituras (legado — use paginação em /sensors)
      description: Endpoint legado mantido para compatibilidade. Depreciado em 2027-01-01;
        desligamento previsto em 2027-06-01.
      operationId: get_sensor_history_api_v1_sensors__sensor_id__data_get
      deprecated: true
      security:
      - HTTPBearer: []
      parameters:
      - name: sensor_id
        in: path
        required: true
        schema:
          type: string
          title: Sensor Id
      - name: period
        in: query
        required: false
        schema:
          type: string
          pattern: ^(1h|24h|7d|30d)$
          description: Janela temporal
          default: 24h
          title: Period
        description: Janela temporal
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Número da página
          default: 1
          title: Page
        description: Número da página
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Itens por página (máx. 100)
          default: 20
          title: Size
        description: Itens por página (máx. 100)
      - name: anomalies_only
        in: query
        required: false
        schema:
          type: boolean
          description: Filtrar apenas anomalias
          default: false
          title: Anomalies Only
        description: Filtrar apenas anomalias
