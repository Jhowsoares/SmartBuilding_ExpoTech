<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <title>Smart Building — Referência da API</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Inter:300,400,600,700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        #redoc-container { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="redoc-container"></div>

    <!-- Bundle oficial e estável do ReDoc via jsDelivr -->
    <script src="https://cdn.jsdelivr.net/npm/redoc@2.1.5/bundles/redoc.standalone.js"></script>
    
    <script>
        // Inicialização com tratamento de caminho relativo
        Redoc.init('./openapi.yaml', {
            scrollYOffset: 50,
            hideDownloadButton: false,
            theme: { 
                colors: { 
                    primary: { main: '#2563eb' } 
                } 
            }
        }, document.getElementById('redoc-container'));
    </script>
</body>
</html>
